name: Build RemoteSupport

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  release: { types: [published] }

permissions:
  contents: write   # only used to attach files to a GitHub Release

jobs:
  # ---------- Windows / macOS / Linux desktop apps ----------
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Build single-file app and smoke-test it
        run: python scripts/build.py
      - name: Zip the macOS app (one file uploads far more reliably than ~1000 loose files)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent RemoteSupport.app RemoteSupport-macOS.zip
          rm -rf RemoteSupport.app
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteSupport-${{ runner.os }}
          path: dist/*

  # ---------- Android APK (artifact name: RemoteSupport-Android-APK) ----------
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: add these 4 repository secrets to sign with your own key (see android/README.md).
      # Without them the APK is signed with a debug key - still installable.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME). android-actions/setup-android@v3
      # is NOT used: it asks sdkmanager for the legacy "tools" package, which the current
      # cmdline-tools no longer has ("Failed to find package 'tools'"), so the job died there.
      - name: Prepare Android SDK (licenses + platform 34 + build-tools 34.0.0)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true      # 'yes' gets SIGPIPE; that is expected
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Use release keystore (if provided)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests (crypto must match the desktop app byte for byte)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RemoteSupport.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteSupport-Android-APK
          path: RemoteSupport.apk
      - name: Attach to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RemoteSupport.apk
